<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Glowing Path Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Curved Road / Path Behind the Letter -->
  <path d="M -20 420 Q 180 380 256 256 T 532 80" 
        fill="none" 
        stroke="url(#roadGrad)" 
        stroke-width="44" 
        stroke-linecap="round"/>

  <!-- Giant Main English 'm' Letter -->
  <text x="215" y="355" 
        text-anchor="middle"
        font-family="'Poppins', 'Montserrat', sans-serif" 
        font-weight="800" 
        font-size="320" 
        fill="#FFFFFF">m</text>

  <!-- Masar Identity Blue Dot -->
  <circle cx="410" cy="320" r="34" fill="#38BDF8"/>
</svg>
